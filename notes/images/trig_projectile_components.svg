 font-weight="bold">30°</text><text x="220.5" y="132.0" fill="#2e9e44" font-size="22" text-anchor="middle" font-weight="bold">u = 20 m/s</text><text x="250.5" y="290.0" fill="#2d6cdf" font-size="19" text-anchor="middle" font-weight="bold">uₓ = 20 cos 30° = 17.32 m/s</text><text x="451.1" y="150.0" fill="#d63031" font-size="19" text-anchor="start" font-weight="bold">uᵧ = 20 sin 30°</text><text x="451.1" y="174.0" fill="#d63031" font-size="19" text-anchor="start" font-weight="bold">    = 10 m/s</text></svg>