<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63031"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e44"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6cdf"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e44ad"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs><rect width="100%" height="100%" fill="white"/><polygon points="160.0,270.0 380.0,310.0 470.0,400.0 250.0,360.0" stroke="#888" fill="#cfe0ff" stroke-width="1" fill-opacity="0.6"/><line x1="160.0" y1="270.0" x2="380.0" y2="310.0" stroke="#2d6cdf" stroke-width="4" opacity="1" marker-end="url(#a3)"/><text x="385.0" y="334.0" fill="#2d6cdf" font-size="24" text-anchor="middle" font-weight="bold">a</text><line x1="160.0" y1="270.0" x2="250.0" y2="360.0" stroke="#d63031" stroke-width="4" opacity="1" marker-end="url(#a1)"/><text x="232.0" y="378.0" fill="#d63031" font-size="24" text-anchor="middle" font-weight="bold">b</text><line x1="160.0" y1="270.0" x2="160.0" y2="70.0" stroke="#2e9e44" stroke-width="5" opacity="1" marker-end="url(#a2)"/><text x="170.0" y="80.0" fill="#2e9e44" font-size="24" text-anchor="start" font-weight="bold">a × b</text><text x="170.0" y="102.0" fill="#2e9e44" font-size="16" text-anchor="start" font-weight="normal">perpendicular to both</text><text x="170.0" y="125.0" fill="#2e9e44" font-size="16" text-anchor="start" font-weight="normal">|a × b| = |a||b| sin θ</text><text x="170.0" y="145.0" fill="#2e9e44" font-size="16" text-anchor="start" font-weight="normal">= area of the parallelogram</text><text x="280.0" y="24.0" fill="#222" font-size="18" text-anchor="middle" font-weight="bold">Right hand rule: fingers a → b, thumb = a × b</text><text x="280.0" y="430.0" fill="#222" font-size="18" text-anchor="middle" font-weight="normal">b × a = −(a × b)   (order matters!)</text></svg>